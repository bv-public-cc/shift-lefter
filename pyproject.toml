[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shift-lefter"
version = "0.1.0"
description = "Local-first secret prevention for Git receive transactions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests==2.34.2", "detect-secrets==1.5.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "black>=24,<26"]
train = ["accelerate>=1.13,<2", "datasets>=4.8,<5", "lightgbm>=4.7,<5", "peft>=0.18,<0.19", "scikit-learn>=1.8,<2", "torch>=2.10,<2.11", "transformers>=4.57,<4.58"]

[tool.setuptools.packages.find]
include = ["shift_lefter*"]

[tool.setuptools.package-data]
"shift_lefter" = ["context_markers.json", "gitleaks.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
